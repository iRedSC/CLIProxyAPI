name: fork-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/iredsc/cli-proxy-api:latest-amd64
            ghcr.io/iredsc/cli-proxy-api:${{ github.sha }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          labels: org.opencontainers.image.source=https://github.com/iRedSC/CLIProxyAPI
          build-args: |
            VERSION=fork
            COMMIT=${{ github.sha }}

  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/iredsc/cli-proxy-api:latest-arm64
            ghcr.io/iredsc/cli-proxy-api:${{ github.sha }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          labels: org.opencontainers.image.source=https://github.com/iRedSC/CLIProxyAPI
          build-args: |
            VERSION=fork
            COMMIT=${{ github.sha }}

  manifest:
    needs: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi architecture tags
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/iredsc/cli-proxy-api:latest \
            ghcr.io/iredsc/cli-proxy-api:latest-amd64 \
            ghcr.io/iredsc/cli-proxy-api:latest-arm64
          docker buildx imagetools create \
            --tag ghcr.io/iredsc/cli-proxy-api:${{ github.sha }} \
            ghcr.io/iredsc/cli-proxy-api:${{ github.sha }}-amd64 \
            ghcr.io/iredsc/cli-proxy-api:${{ github.sha }}-arm64
